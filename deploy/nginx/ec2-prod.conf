# =============================================================================
# nginx — dedicated EC2 edge for the V3 BYOT storefront (prod)
# =============================================================================
# Cloudflare (Flexible) terminates TLS and forwards HTTP to :80 here. This box
# is host-AGNOSTIC: it proxies EVERY Host to the storefront container, which
# resolves the tenant from the Host header using NUMU_PLATFORM_DOMAIN. So there
# is no per-store server block to maintain — adding a store is just a CF DNS
# record, no nginx change.
# =============================================================================

worker_processes auto;
error_log /dev/stderr warn;  # → container stderr → CloudWatch (awslogs). access_log stays file-based.
events { worker_connections 1024; use epoll; multi_accept on; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json_combined escape=json '{'
        '"time":"$time_local","remote_addr":"$remote_addr","host":"$host",'
        '"request":"$request","status":"$status","bytes":"$body_bytes_sent",'
        '"rt":"$request_time","urt":"$upstream_response_time","ua":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/javascript image/svg+xml application/wasm;

    # Cache policy for /__numu-runtime/ — keyed on whether the request carries
    # the `?v=<hash>` cache-buster the import map builds from the manifest.
    #
    # These files are NOT content-hashed in their FILENAME (unlike _next/static),
    # so `immutable` is only ever true of a VERSIONED request. `urlFor` falls
    # back to the bare URL whenever the manifest lacks an entry for a file, and
    # a bare URL under a one-year immutable rule is pinned for a year — the
    # same failure mode that blanked live storefronts through manifest.json,
    # which is why that file is carved out below. This makes the bare form
    # revalidate instead of being poisoned, and keeps the fast path fast.
    map $arg_v $numu_runtime_cache {
        ""      "public, max-age=0, must-revalidate";
        default "public, max-age=31536000, immutable";
    }

    # Trust Cloudflare for the real client IP.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Docker embedded DNS so the storefront upstream resolves at request time
    # (container can restart without an nginx reload).
    resolver 127.0.0.11 valid=30s ipv6=off;

    limit_req_zone $binary_remote_addr zone=sf_limit:10m rate=30r/s;

    # Authenticated Uptime Kuma dashboard. It runs on the storefront host so
    # it remains available if either API deployment slot fails.
    server {
        listen 80;
        server_name status.numueg.app;

        location / {
            set $kuma http://uptime-kuma:3001;
            proxy_pass $kuma;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;
        }
    }

    # n8n.numueg.app — workflow automation (migrated off the droplet 2026-06-30).
    # A specific server_name wins over the `_` default below, so n8n traffic is
    # routed to the n8n container while every other Host still hits storefront.
    # WebSocket upgrade + long timeouts for the editor push channel + executions.
    server {
        listen 80;
        server_name n8n.numueg.app;
        client_max_body_size 50M;

        location / {
            set $n8n http://n8n:5678;
            proxy_pass $n8n;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;   # CF terminated TLS
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }


    # mcp.numueg.app � NUMU MCP server (AI merchant assistant; repo
    # NUMU-IO/NUMU-MCP, deployed by its own CD to this box). A specific
    # server_name wins over the `_` default, so every other Host still hits
    # the storefront. Lazy upstream (`set $mcp`) � if the MCP container is
    # down, ONLY mcp.numueg.app 502s; storefront traffic is unaffected.
    server {
        listen 80;
        server_name mcp.numueg.app;
        client_max_body_size 10M;

        location / {
            limit_req zone=sf_limit burst=30 nodelay;
            set $mcp http://numu-mcp-prod:8765;
            proxy_pass $mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;   # CF terminated TLS
            proxy_set_header Authorization $http_authorization;
            proxy_buffering off;          # SSE-friendly (streamable HTTP)
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        # Cloudflare-for-SaaS custom hostnames (merchant-owned domains) are NOT
        # covered by the zone's Flexible mode: Cloudflare dials the origin on 443
        # for them, so without this listener every custom domain returns 521 while
        # *.numueg.app keeps working on :80. Cloudflare Origin CA cert, valid to
        # 2041, trusted by Cloudflare only — which is the point.
        #
        # The cert lives in deploy/nginx/certs/ and is deliberately NOT in git
        # (it holds a private key); it is placed on the box once and survives
        # deploys because the directory is untracked.
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_certificate     /etc/nginx/certs/origin.pem;
        ssl_certificate_key /etc/nginx/certs/origin.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        server_name _;

        client_max_body_size 15M;

        # The BYOT runtime manifest is the ONE file under __numu-runtime/ that
        # is NOT immutable, so it must be carved out of the rule below.
        #
        # It is an unversioned, MUTABLE pointer naming the SDK version the host
        # currently serves, and external-loader gates every federated theme
        # bundle on it. The blanket rule below cached it for a year, so a
        # browser that loaded the site while the host served 0.10.x pinned that
        # manifest and afterwards compared today's 0.12 theme against it —
        # producing "Theme built against SDK 0.12 but host runtime serves
        # 0.10.0" and a blank storefront, on a completely healthy server.
        #
        # `location =` is an exact match, which nginx evaluates before any
        # regex location, so this wins regardless of ordering.
        # `proxy_hide_header` drops the app's own Cache-Control so the response
        # carries exactly ONE — previously the upstream's max-age=300 and this
        # server's immutable were BOTH sent, and the stricter one won.
        location = /__numu-runtime/manifest.json {
            set $sf http://storefront:3000;
            proxy_pass $sf;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
        }

        # Next's static output is content-hashed in the FILENAME, so it is
        # immutable unconditionally.
        location ~* ^/_next/static/ {
            set $sf http://storefront:3000;
            proxy_pass $sf;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # The BYOT runtime files carry their version in the QUERY (`?v=<hash>`),
        # not the filename — so only a versioned request may be cached forever.
        # See the $numu_runtime_cache map. `proxy_hide_header` keeps exactly one
        # Cache-Control on the response: the upstream also sets one, and when
        # both were sent the stricter won regardless of what we chose here.
        location ~* ^/__numu-runtime/ {
            set $sf http://storefront:3000;
            proxy_pass $sf;
            proxy_set_header Host $host;
            proxy_hide_header Cache-Control;
            add_header Cache-Control $numu_runtime_cache always;
        }

        location / {
            limit_req zone=sf_limit burst=60 nodelay;
            set $sf http://storefront:3000;
            proxy_pass $sf;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;   # CF terminated TLS
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 60s;

            # The merchant hub's theme editor iframes the live storefront. Any
            # add_header in a location drops inherited http-level headers, so
            # re-declare and let CSP frame-ancestors override the CF-stamped XFO.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # geolocation=(self) — the checkout "use my location" pin needs
            # first-party geolocation. `()` disabled it for every origin, so
            # navigator.geolocation.getCurrentPosition() failed with permission
            # denied (no prompt) even over HTTPS. camera/microphone stay locked.
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), interest-cohort=()" always;
            add_header Content-Security-Policy "frame-ancestors 'self' https://numueg.app https://*.numueg.app" always;
        }
    }
}
